<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>signup</title>
</head>
<body dir="rtl" class="signup-page">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="signup.html">تسجيل جديد</a></li>
                <li><a href="">هدف الموقع</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>تسجيل جديد</h1>
            <form action="" method="post">
        <div class="signup-form-div">
                <div>
                
                    <label for="name">الاسم الاول:</label>
                    
                    <input type="text" name="name" id="name" required>
                   
                </div>

               <div>
                     <label for="lastname">الاسم الاخير:</label>
                    <input type="text" name="lastname" id="lastname" required>
               </div>

               <div>
                    <label for="email">الايميل:</label>
                    <input type="email" name="email" id="email" required>
               </div>

              <div>
                 <label for="password">كلمة المرور:</label>
                    <input type="password" name="password" id="password" required>
              </div>

                <div>
                    <label for="signcode">رمز التسجيل:</label>
                    <input type="password" name="signcode" id="signcode" required>
               </div>
               <div>
                    <button type="submit">تسجيل</button>
                    </div>
                    </div>
            </form>
        </section>
    </main>

    <footer></footer>
</body>
</html>
