<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>dashboard</title>
</head>

<body dir="rtl" class="engineer-page">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="">الملخص</a></li>
                <li><a href="">الطلبات</a></li>
                <li><a href="">المتدربين</a></li>
                <li class="profile-img"><a href=""><img src="images/icons8-profile-100.png" alt="الملف الشخصي"></a></li>
            </ul>
        </nav>
    </header>


    <div class="container">
        <aside>
            <section class="chat">
               <div class="chat-wrapper">
                <div class="text-time">
                    <h3>السلام عليكم عندي مشكله</h3>
                    <span>5pm</span>
                </div>

                  <div class="text-time2">
                    <h3>وعليكم السلام وش مشكلتك؟</h3>
                    <span>5pm</span>
                </div>
                 

                </div>
              
                 <div class="chat-input">
                    <input type="text">
                     <button type="submit" title="ارسال">
                        ارسال
                     </button>

                </div>
               
            </section>
        </aside>

        <main>
            <section class="summary">

                <div class="card item1">
                    <span class="card-value">عدد المشاكل</span>

                </div>
                <div class="card item2">مشاكل لم يتم حلها بعد</div>
                <div class="card item3">عدد المشاكل</div>
                <div class="card item4">عددا</div>
                <div class="card item5">item5</div>

            </section>

            <section class="requests">

                <div class="request-card">
                    <div class="request-content">

                        <div class="row-start">
                            <div class="request-counter">
                                <span>الايام:5</span>
                            </div>
                            <div class="request-title">
                                <span>طلب صيانه</span>
                            </div>

                            <div class="request-issue">
                                <span>انترنت</span>
                            </div>

                        </div>
                        <div class="row-center">

                        </div>
                        
                        <div class="row-end">
                            <div class="request-discreption">
                                <span>واجهتني مشكله في الانترنت...</span>
                            </div>
                            <div class="request-left">
                                <div class="request-building">
                                    <img src="images/building.svg">
                                    <span>2</span>
                                </div>
                                <div class="request-floor">
                                    
                               <img src="images/floor.svg">
                                    <span >3</span>
                                </div>
                                <div class="request-class">

                                     <img src="images/table.svg">

                                    <span>23</span>
                                </div>

                            </div>

                        </div>

                    </div>
                </div>






            </section>

        </main>
    </div>

    <footer>

    </footer>

</body>

</html>
