<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>signin-up</title>
</head>
<body dir="rtl" class="signin-up-page">
   <header>
    <nav>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="signin-up.html">تسجيل الدخول</a></li>
            <li><a href="signin-up.html">تسجيل جديد</a></li>
            <li><a href="">هدف الموقع</a></li>
        </ul>
    </nav>
   </header> 

   <main>
 
    <div class="card">
      

        <section class="signup" id="signup">
          <form action="" method="post">
            <div class="title">
                <h1>تسجيل الدخول</h1>
            </div>

            <div class="signupemail">
                <div class="align-label">
            <label for="signupemail">الإيميل</label>
             </div>
             <div class="align-input">
            <input type="email" name="signupemail" id="signupemail" placeholder="naif@example.com">
             </div>
            </div>

            <div class="signupPassowrd">
                <div class="align-label">
            <label for="signupPassowrd">كلمة المرور</label>
             </div>
             <div class="align-input">
            <input type="password" name="signupPassowrd" id="signupPassowrd" placeholder="ادخل كلمة المرور">
           </div>
        </div>
            <div ><div class="forggot"><a href="">نسيت كلمة المرور؟</a></div></div>
            
            <div class="button">
            <button type="submit" >تسجيل الدخول</button>
             <button type="button" class="signin-button" id="signin-button" >تسجيل جديد</button>

            </div>
        
       
        

        </form>
        
        </section>

        <section class="signin" id="signin">
     
            <form action="" method="post">
                       <div class="title"><h1>تسجيل جديد</h1></div>
                <div class="signinfname">
                    <div class="align-label">
                        <label for="signinfname">الإسم الأول</label>
                    </div>
                    <div class="align-input">
                        <input type="text" name="signinfname" id="signinfname" placeholder="ادخل الاسم الأول">
                    </div>
                </div>
                 <div class="signinlname">
                    <div class="align-label">
                        <label for="signinlname">الإسم الأخير</label>
                    </div>
                    <div class="align-input">
                        <input type="text" name="signinlname" id="signinlname" placeholder="ادخل الاسم الأخير">
                    </div>
                </div>
                 <div class="signinemail">
                    <div class="align-label">
                        <label for="signinemail">الإيميل</label>
                    </div>
                    <div class="align-input">
                        <input type="email" name="signinemail" id="signinemail" placeholder="naif@example.com">
                    </div>
                </div>
                 <div class="signinpassword">
                    <div class="align-label">
                        <label for="signinpassword">كلمة المرور</label>
                    </div>
                    <div class="align-input">
                        <input type="password" name="signinpassword" id="signinpassword" placeholder="ادخل كلمة المرور">
                    </div>
                </div>
                <div class="signin-code">
                    <div class="align-label">
                        <label for="signin-code">رمز التسجيل</label>
                    </div>
                    <div class="align-input">
                        <input type="signin-code" name="signin-code" id="signin-code" placeholder="ادخل رمز التسجيل">
                    </div>
                </div>
                <div class="button">
                    <div class="align-button">
                    <button class="signup-button" id="signup-button" type="button">تسجيل الدخول</button>
                    <button class="signin-button" type="submit">تسجيل جديد</button>

                  </div>
                   
                </div>
            </form>
        </section>

    </div>
   </main>

   <footer></footer>

   <script src="JavaScript.js"></script>
</body>
</html>
