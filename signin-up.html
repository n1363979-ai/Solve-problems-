<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>signin-up</title>
</head>
<body dir="rtl" class="signin-up-page">
   <header>
    <nav>
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="signin-up.html">تسجيل الدخول</a></li>
            <li><a href="signin-up.html">تسجيل جديد</a></li>
            <li><a href="">هدف الموقع</a></li>
        </ul>
    </nav>
   </header> 

   <main>
 
    <div class="card">
      

        <section class="signup">
          <form action="" method="post">
            <div class="title">
                <h1>تسجيل الدخول</h1>
            </div>

            <div class="email">
                <div class="align-label">
            <label for="email">الإيميل</label>
             </div>
             <div class="align-input">
            <input type="email" name="email" id="email" placeholder="naif@example.com">
             </div>
            </div>

            <div class="passowrd">
                <div class="align-label">
            <label for="password">كلمة المرور</label>
             </div>
             <div class="align-input">
            <input type="password" name="password" id="password" placeholder="ادخل كلمة المرور">
           </div>
        </div>
            <div ><div class="forggot"><a href="">نسيت كلمة المرور؟</a></div></div>
            
            <div class="button">
            <button type="submit">تسجيل الدخول</button>
             <button class="signin-button">تسجيل جديد</button>

            </div>
        
       
        

        </form>
        
        </section>

        <section class="signin">
     
            <form action="" method="post">
                       <div class="title"><h1>تسجيل جديد</h1></div>
                <div class="fname">
                    <div class="align-label">
                        <label for="fname">الإسم الأول</label>
                    </div>
                    <div class="align-input">
                        <input type="text" name="fname" id="name" placeholder="ادخل الاسم الأول">
                    </div>
                </div>
                 <div class="lname">
                    <div class="align-label">
                        <label for="lname">الإسم الأخير</label>
                    </div>
                    <div class="align-input">
                        <input type="text" name="lname" id="lname" placeholder="ادخل الاسم الأخير">
                    </div>
                </div>
                 <div class="email">
                    <div class="align-label">
                        <label for="email">الإيميل</label>
                    </div>
                    <div class="align-input">
                        <input type="email" name="email" id="email" placeholder="naif@example.com">
                    </div>
                </div>
                 <div class="password">
                    <div class="align-label">
                        <label for="password">كلمة المرور</label>
                    </div>
                    <div class="align-input">
                        <input type="password" name="password" id="password" placeholder="ادخل كلمة المرور">
                    </div>
                </div>
                <div class="signin-code">
                    <div class="align-label">
                        <label for="signin-code">رمز التسجيل</label>
                    </div>
                    <div class="align-input">
                        <input type="signin-code" name="signin-code" id="signin-code" placeholder="ادخل رمز التسجيل">
                    </div>
                </div>
                <div class="button">
                    <div class="align-button">
                    <button class="signup-button">تسجيل جديد</button>
                    <button class="signin-button" type="submit">تسجيل</button>

                  </div>
                   
                </div>
            </form>
        </section>

    </div>
   </main>

   <footer></footer>
</body>
</html>
